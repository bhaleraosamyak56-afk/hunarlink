<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders &amp; Live Tracking — HunarLink Valley Craft Guild</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="user-portal.css">
</head>

<body>

  <!-- Shared Top Header -->
  <header class="up-header">
    <div class="up-header-inner">
      <a href="../index.html" class="up-brand">
        <span class="up-emblem">H</span>
        <div>
          <div class="up-brand-title">HunarLink</div>
          <div class="up-brand-sub">Live Order Tracking</div>
        </div>
      </a>
      <nav class="up-nav-links">
        <a href="../index.html"
          class="up-nav-pill">🏠 Storefront</a>
        <a href="profile.html" class="up-nav-pill">👤 My Profile</a>
        <a href="orders.html" class="up-nav-pill active">📦 Track Orders</a>
        <a href="login.html" class="up-nav-pill">🔐 User Login</a>
      </nav>
    </div>
  </header>

  <!-- Flipkart-Style Order Tracking Workspace -->
  <main class="up-container">
    <div class="orders-layout">

      <!-- Left Filters + Logged-In User Info Card (Like Flipkart Filters) -->
      <aside class="orders-filter-card">
        <div style="padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--border-light);">
          <div style="font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-500); margin-bottom: 6px;">
            Collector Account
          </div>
          <div style="font-family: var(--font-serif); font-size: 1.25rem; font-weight: 700; color: var(--heading-color);"
            id="trk-user-name">Priya Sharma</div>
          <div style="font-size: 0.76rem; color: var(--text-700);" id="trk-user-contact">priya.sharma@valleycollector.in</div>
          <a href="profile.html" class="btn-link-edit" style="display: inline-block; padding-left: 0; margin-top: 6px;">
            ✏️ Customize Profile →
          </a>
        </div>

        <h3 style="font-size: 1.15rem; margin-bottom: 12px;">Filters</h3>

        <div style="margin-bottom: 16px;">
          <div style="font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-500); margin-bottom: 8px;">
            ORDER STATUS
          </div>
          <label class="gender-radio-label" style="display: flex; margin-bottom: 8px;">
            <input type="radio" name="status-filter" value="all" checked onchange="renderOrders()"> All Orders
          </label>
          <label class="gender-radio-label" style="display: flex; margin-bottom: 8px;">
            <input type="radio" name="status-filter" value="ontheway" onchange="renderOrders()"> On the Way
          </label>
          <label class="gender-radio-label" style="display: flex; margin-bottom: 8px;">
            <input type="radio" name="status-filter" value="delivered" onchange="renderOrders()"> Delivered
          </label>
        </div>

        <button type="button" class="btn-orange-outline" style="width: 100%;" onclick="placeQuickDemoOrder()">
          ⚡ Create Sample Order
        </button>
      </aside>

      <!-- Right Orders List & Live Tracking Cards -->
      <section>
        <div class="orders-search-bar">
          <input type="text" id="orders-search-input" class="up-input"
            placeholder="Search your orders by Order ID, craft title, artisan, or GI ID..." oninput="renderOrders()">
          <button type="button" class="btn-orange" onclick="renderOrders()">🔍 Search Orders</button>
        </div>

        <div id="orders-list-wrap"></div>
      </section>

    </div>
  </main>

  <div class="up-toast" id="up-toast"></div>

  <script src="user-portal.js"></script>
  <script>
    const ORDER_STAGES = [
      { label: "Order Confirmed", desc: "Received by HunarLink Escrow" },
      { label: "GI Seal Verified", desc: "Lab purity & laser QR sealed" },
      { label: "Packed at Loom", desc: "Insured Kashmiri heirloom box" },
      { label: "Out for Delivery", desc: "Tracked insured transit" },
      { label: "Delivered", desc: "Verified by Collector" }
    ];

    function getOrdersList() {
      const saved = upLoad(UP_KEYS.ORDERS, null);
      if (saved && saved.length) return saved;
      const prof = upGetProfile();
      return [
        {
          id: "HL-ORD-2026-7814",
          date: "15 Nov 2026",
          time: "11:20 AM",
          buyer: {
            name: prof.fullName,
            phone: prof.phone,
            email: prof.email,
            addressType: "Home",
            locality: "B-42 Defence Colony, Ring Road",
            city: "New Delhi",
            pincode: "110024"
          },
          items: [
            {
              productId: "hl-pash-001",
              title: "Royal Khudrang Pashmina Shawl",
              qty: 1,
              price: 1650,
              lineTotal: 1650,
              giId: "GI-JK-PASH-8821",
              artisan: "Master Ghulam Qadir Mir",
              image: "assets/products/pashmina_01.jpg"
            }
          ],
          subtotal: 1650,
          discount: 0,
          total: 1650,
          paymentMethod: "UPI Verified Escrow",
          paymentStatus: "Paid (Escrow Protected)",
          address: `${prof.fullName}, B-42 Defence Colony, New Delhi - 110024`,
          stage: 3,
          sellerNote: "Hand-inspected at Srinagar Loom. Dispatched via BlueDart Insured Air Express (AWB #JK882190)."
        }
      ];
    }

    function renderOrders() {
      const prof = upGetProfile();
      document.getElementById("trk-user-name").textContent = prof.fullName;
      document.getElementById("trk-user-contact").textContent = `${prof.email} • ${prof.phone}`;

      const query = (document.getElementById("orders-search-input")?.value || "").trim().toLowerCase();
      const statusFilter = document.querySelector('input[name="status-filter"]:checked')?.value || "all";

      let orders = getOrdersList();
      if (statusFilter === "ontheway") {
        orders = orders.filter(o => (o.stage || 1) < 5);
      } else if (statusFilter === "delivered") {
        orders = orders.filter(o => (o.stage || 1) >= 5);
      }

      if (query) {
        orders = orders.filter(o =>
          (o.id || "").toLowerCase().includes(query) ||
          (o.address || "").toLowerCase().includes(query) ||
          (o.items || []).some(i =>
            (i.title || "").toLowerCase().includes(query) ||
            (i.giId || "").toLowerCase().includes(query) ||
            (i.artisan || "").toLowerCase().includes(query)
          )
        );
      }

      const wrap = document.getElementById("orders-list-wrap");
      if (!orders.length) {
        wrap.innerHTML = `
          <div class="fk-panel-card" style="text-align: center; padding: 42px 20px;">
            <div style="font-size: 2.2rem; margin-bottom: 8px;">📦</div>
            <h3>No orders found</h3>
            <p style="font-size: 0.84rem; color: var(--text-500); margin: 6px 0 18px;">
              Place an order on HunarLink or click below to create a live sample order for tracking.
            </p>
            <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
              <a href="../index.html#marketplace-section" class="btn-orange">Shop Kashmiri Crafts →</a>
              <button type="button" class="btn-orange-outline" onclick="placeQuickDemoOrder()">⚡ Create Sample Order</button>
            </div>
          </div>
        `;
        return;
      }

      wrap.innerHTML = orders.map(o => {
        const stage = Math.max(1, Math.min(5, o.stage || 1));
        const stageInfo = ORDER_STAGES[stage - 1];
        const b = o.buyer || {};
        const buyerName = b.name || prof.fullName;
        const buyerPhone = b.phone || prof.phone;
        const buyerEmail = b.email || prof.email;
        const buyerAddr = b.locality
          ? `${b.locality}, ${b.city || ""}${b.pincode ? " - " + b.pincode : ""}`
          : (o.address || "Verified Delivery Address");
        const subtotal = o.subtotal || o.total || 0;
        const discount = o.discount || 0;
        const firstProdId = (o.items && o.items[0] && o.items[0].productId) || "hl-pash-001";

        return `
          <article class="fk-order-card">
            <div class="fk-order-top">
              <div>
                <div class="fk-order-id">Order #${upEsc(o.id)}</div>
                <div style="font-size: 0.76rem; color: var(--text-500);">
                  Ordered on <strong>${upEsc(o.date || "Recent")}</strong>${o.time ? " at " + upEsc(o.time) : ""} •
                  <strong>${upEsc(o.paymentMethod || "UPI Verified Escrow")}</strong>
                </div>
              </div>
              <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                <span style="font-size: 0.74rem; font-weight: 700; padding: 5px 12px; border-radius: 999px; background: ${stage >= 5 ? "var(--success-50)" : "var(--btn-orange-soft)"}; color: ${stage >= 5 ? "var(--success-600)" : "var(--heading-color)"}; border: 1px solid ${stage >= 5 ? "#BFE3CE" : "var(--btn-orange-border)"};">
                  ● ${upEsc(stageInfo.label)}
                </span>
                <button type="button" class="btn-orange-outline" style="padding: 6px 12px; font-size: 0.74rem;" onclick="window.print()">
                  🖨️ GI Invoice
                </button>
              </div>
            </div>

            <div class="fk-order-body">
              <!-- Left Column: Ordered Items + Live Flipkart Tracking Bar + Review -->
              <div>
                ${(o.items || []).map(item => `
                  <div class="fk-item-row">
                    <img src="${upResolveImg(item.image)}" class="fk-item-thumb" alt="${upEsc(item.title)}">
                    <div style="flex: 1; min-width: 0;">
                      <a href="../product.html?id=${encodeURIComponent(item.productId || "hl-pash-001")}"
                        style="font-weight: 700; color: var(--heading-color); text-decoration: none; font-size: 0.9rem;">
                        ${upEsc(item.title)}
                      </a>
                      <div style="font-size: 0.74rem; color: var(--text-500); margin-top: 2px;">
                        Qty: <strong>${item.qty || 1}</strong> • GI Tag: <code>${upEsc(item.giId || "GI-VERIFIED")}</code>
                        ${item.artisan ? ` • By ${upEsc(item.artisan)}` : ""}
                      </div>
                    </div>
                    <div style="font-weight: 800; color: var(--text-900); font-size: 0.92rem;">
                      ${upFormatINR(item.lineTotal || (item.price * (item.qty || 1)))}
                    </div>
                  </div>
                `).join("")}

                <!-- Flipkart-Style 5-Stage Live Progress Tracker -->
                <div class="fk-tracker-wrap">
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 6px;">
                    <span style="font-size: 0.74rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--heading-color);">
                      🚚 Live Shipment Status — ${upEsc(stageInfo.desc)}
                    </span>
                    ${stage < 5 ? `<button type="button" class="btn-link-edit" onclick="advanceTracking('${upEsc(o.id)}')">Simulate Next Stage →</button>` : `<span style="font-size: 0.74rem; font-weight: 700; color: var(--success-600);">✓ Delivered Successfully</span>`}
                  </div>
                  <div class="fk-tracker-steps">
                    ${ORDER_STAGES.map((st, idx) => {
                      const sNum = idx + 1;
                      const done = sNum <= stage;
                      const current = sNum === stage;
                      return `
                        <div class="fk-step ${done ? "done" : ""} ${current ? "current" : ""}">
                          <div class="fk-step-dot">${done ? "✓" : sNum}</div>
                          <div class="fk-step-label">${upEsc(st.label)}</div>
                        </div>
                      `;
                    }).join("")}
                  </div>
                </div>

                ${o.sellerNote ? `
                  <div class="seller-note-banner">
                    <strong>✦ Live Update from Artisan Workshop:</strong> ${upEsc(o.sellerNote)}
                  </div>
                ` : ""}

                <!-- Inline Rate & Review Craft (Syncs to Seller Portal Responses!) -->
                <form onsubmit="submitOrderReview(event, '${upEsc(firstProdId)}', '${upEsc(o.id)}')"
                  style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px;">
                  <select id="rev-rating-${upEsc(o.id)}" class="up-select" style="width: auto; padding: 8px 10px; font-size: 0.78rem;">
                    <option value="5">★★★★★ (5)</option>
                    <option value="4">★★★★☆ (4)</option>
                    <option value="3">★★★☆☆ (3)</option>
                  </select>
                  <input type="text" id="rev-text-${upEsc(o.id)}" class="up-input" style="flex: 1 1 200px; padding: 8px 12px; font-size: 0.8rem;"
                    placeholder="Rate & review this Kashmiri craft for the artisan..." required>
                  <button type="submit" class="btn-orange" style="padding: 8px 14px; font-size: 0.78rem;">★ Submit Review</button>
                </form>
              </div>

              <!-- Right Column: Complete User & Delivery Details + Price Breakdown -->
              <div class="fk-info-sidebar">
                <div class="fk-info-box">
                  <h4>👤 Delivery &amp; User Information</h4>
                  <div style="font-weight: 700; color: var(--text-900); margin-bottom: 3px;">
                    ${upEsc(buyerName)}
                    <span class="addr-type-chip" style="margin-left: 6px;">${upEsc(b.addressType || "Home")}</span>
                  </div>
                  <div style="color: var(--text-700); margin-bottom: 6px;">${upEsc(buyerAddr)}</div>
                  <div style="font-size: 0.76rem; color: var(--text-700);">
                    <div><strong>Phone:</strong> ${upEsc(buyerPhone)}</div>
                    <div><strong>Email:</strong> ${upEsc(buyerEmail)}</div>
                  </div>
                </div>

                <div class="fk-info-box">
                  <h4>💳 Price &amp; Escrow Details</h4>
                  <div class="fk-price-line">
                    <span>Craft Subtotal</span>
                    <span>${upFormatINR(subtotal)}</span>
                  </div>
                  ${discount > 0 ? `
                    <div class="fk-price-line" style="color: var(--success-600);">
                      <span>Coupon / Guild Savings</span>
                      <span>− ${upFormatINR(discount)}</span>
                    </div>
                  ` : ""}
                  <div class="fk-price-line">
                    <span>Insured Transit Shipping</span>
                    <span style="color: var(--success-600); font-weight: 700;">FREE</span>
                  </div>
                  <div class="fk-price-line total">
                    <span>Total Paid</span>
                    <span>${upFormatINR(o.total)}</span>
                  </div>
                  <div style="font-size: 0.72rem; color: var(--success-600); font-weight: 700; margin-top: 6px;">
                    🛡️ ${upEsc(o.paymentStatus || "Protected by HunarLink Escrow")}
                  </div>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function advanceTracking(orderId) {
      const orders = getOrdersList();
      const target = orders.find(o => o.id === orderId);
      if (!target) return;
      target.stage = Math.min(5, (target.stage || 1) + 1);
      upSave(UP_KEYS.ORDERS, orders);
      renderOrders();
      upToast(`🚚 Order #${orderId} updated to: ${ORDER_STAGES[target.stage - 1].label}`);
    }

    function submitOrderReview(e, productId, orderId) {
      e.preventDefault();
      const rating = parseInt(document.getElementById(`rev-rating-${orderId}`).value, 10) || 5;
      const comment = document.getElementById(`rev-text-${orderId}`).value.trim();
      if (!comment) return;
      const prof = upGetProfile();
      const reviews = upLoad(UP_KEYS.REVIEWS, {});
      reviews[productId] = reviews[productId] || [];
      reviews[productId].unshift({
        author: prof.fullName,
        rating,
        date: new Date().toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }),
        comment
      });
      upSave(UP_KEYS.REVIEWS, reviews);
      document.getElementById(`rev-text-${orderId}`).value = "";
      upToast("★ Review submitted & synced directly to the artisan's Seller Portal!");
    }

    function placeQuickDemoOrder() {
      const prof = upGetProfile();
      const addrs = upLoad(UP_KEYS.ADDRESSES, []);
      const a = addrs[0] || {
        name: prof.fullName,
        phone: prof.phone,
        locality: "B-42 Defence Colony, Ring Road",
        city: "New Delhi",
        pincode: "110024",
        type: "Home"
      };
      const now = new Date();
      const orderId = "HL-ORD-2026-" + Math.floor(1000 + Math.random() * 9000);
      const newOrder = {
        id: orderId,
        date: now.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }),
        time: now.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" }),
        createdAt: now.toISOString(),
        buyer: {
          name: a.name || prof.fullName,
          phone: a.phone || prof.phone,
          email: prof.email,
          addressType: a.type || "Home",
          locality: a.locality,
          city: a.city,
          pincode: a.pincode
        },
        items: [
          {
            productId: "hl-pash-002",
            title: "Jamawar Heirloom Stole",
            qty: 1,
            price: 1850,
            lineTotal: 1850,
            giId: "GI-JK-PASH-8810",
            artisan: "Master Ghulam Qadir Mir",
            image: "assets/products/pashmina_02.jpg"
          }
        ],
        subtotal: 1850,
        discount: 0,
        total: 1850,
        artisanPayout: 1850,
        paymentMethod: prof.preferredPayment || "UPI Verified Escrow",
        paymentStatus: "Paid (Escrow Protected)",
        address: `${a.name}, ${a.locality}, ${a.city} - ${a.pincode}`,
        stage: 2,
        sellerNote: "GI Laser Seal verified at Srinagar Guild. Preparing insured heirloom packaging.",
        isNewForSeller: true
      };

      const orders = getOrdersList();
      orders.unshift(newOrder);
      upSave(UP_KEYS.ORDERS, orders);
      renderOrders();
      upToast(`✓ Live Order #${orderId} created & synced to Seller Portal!`);
    }

    window.addEventListener("storage", (ev) => {
      if (ev.key === UP_KEYS.ORDERS || ev.key === UP_KEYS.BUYER_PROFILE) {
        renderOrders();
      }
    });

    window.addEventListener("DOMContentLoaded", renderOrders);
  </script>
</body>

</html>
